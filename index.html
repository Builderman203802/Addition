<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f4f6;
}

header{
background:#6366f1;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
background:#e5e7eb;
flex-wrap:wrap;
}

.tabs button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#6366f1;
color:white;
cursor:pointer;
}

.tab{
display:none;
padding:20px;
max-width:600px;
margin:auto;
}

.links{
display:flex;
flex-direction:column;
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card a{
text-decoration:none;
font-weight:bold;
color:#111827;
}

.delete{
background:none;
border:none;
color:red;
cursor:pointer;
}

.addpanel{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:white;
padding:12px;
border-radius:16px;
box-shadow:0 4px 20px rgba(0,0,0,0.15);
width:90%;
max-width:600px;
}

.addpanel input,.addpanel select{
width:100%;
padding:10px;
margin-bottom:6px;
border-radius:8px;
border:1px solid #ccc;
}

.addpanel button{
width:100%;
padding:10px;
background:#6366f1;
color:white;
border:none;
border-radius:10px;
}

#messages{
height:300px;
overflow-y:auto;
border:1px solid #ccc;
padding:10px;
background:white;
border-radius:10px;
margin-top:10px;
}

.host{
color:#6366f1;
font-weight:bold;
}

.system{
color:gray;
font-style:italic;
}

</style>
</head>

<body>

<header>LinkHub</header>

<div class="tabs">
<button onclick="switchTab('links')">Links</button>
<button onclick="switchTab('public')">Public Links</button>
<button onclick="switchTab('chat')">Live Chat</button>
<button onclick="switchTab('about')">About</button>
</div>

<!-- LINKS -->

<div id="links" class="tab">

<input id="search" placeholder="Search..." oninput="renderLinks()">

<select id="filter" onchange="renderLinks()">
<option value="all">All</option>
<option value="school">School</option>
<option value="social">Social</option>
<option value="tools">Tools</option>
<option value="other">Other</option>
</select>

<div id="linksContainer" class="links"></div>

</div>

<!-- PUBLIC LINKS -->

<div id="public" class="tab">
Public links coming soon.
</div>

<!-- CHAT -->

<div id="chat" class="tab">

<input id="username" placeholder="Username">
<input id="room" placeholder="Room name">
<input id="password" placeholder="Room password">

<button onclick="createRoom()">Create Room</button>
<button onclick="joinRoom()">Join Room</button>
<button onclick="leaveRoom()">Leave Room</button>

<div id="chatBox" style="display:none">

<div id="messages"></div>

<input id="messageInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

</div>

</div>

<!-- ABOUT -->

<div id="about" class="tab">
LinkHub is a utility-first workspace for organizing links and collaborating in live chat rooms.
</div>

<!-- ADD LINK PANEL -->

<div class="addpanel">

<input id="linkName" placeholder="Link name">
<input id="linkURL" placeholder="https://example.com">

<select id="linkCategory">
<option value="school">School</option>
<option value="social">Social</option>
<option value="tools">Tools</option>
<option value="other">Other</option>
</select>

<button onclick="addLink()">Add Link</button>

</div>

<!-- FIREBASE LIBRARIES -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- FIREBASE CONFIG -->

<script>
  
const firebaseConfig = {
  apiKey: "AIzaSyALYWhJMp4GZMBFWiSYAMXKruatPTLguWM",
  authDomain: "linkhub-chat.firebaseapp.com",
  databaseURL: "https://linkhub-chat-default-rtdb.firebaseio.com",
  projectId: "linkhub-chat",
  storageBucket: "linkhub-chat.firebasestorage.app",
  messagingSenderId: "767419596281",
  appId: "1:767419596281:web:71abdb6a3b21a17e67d128"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
  
</script>

<!-- MAIN SITE CODE -->

<script>

let currentRoom=null;  
  
/* TABS */

function switchTab(id){

document.querySelectorAll(".tab").forEach(t=>t.style.display="none");

document.getElementById(id).style.display="block";

}

switchTab("links");

/* LINKS */

let links = JSON.parse(localStorage.getItem("links") || "[]");

function saveLinks(){
localStorage.setItem("links",JSON.stringify(links));
}

function renderLinks(){

const container=document.getElementById("linksContainer");

const search=(document.getElementById("search").value||"").toLowerCase();

const filter=document.getElementById("filter").value;

container.innerHTML="";

links

.filter(l=>(l.name||"").toLowerCase().includes(search))

.filter(l=>filter==="all"||l.category===filter)

.forEach((link,i)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<div>
<a href="${link.url}" target="_blank">${link.name}</a>
<div>${link.category}</div>
</div>
<button class="delete" onclick="deleteLink(${i})">🗑</button>
`;

container.appendChild(card);

});

}

function addLink(){

const name=document.getElementById("linkName").value;
const url=document.getElementById("linkURL").value;
const cat=document.getElementById("linkCategory").value;

if(!name||!url) return alert("Fill fields");

links.push({name,url,category:cat});

saveLinks();
renderLinks();

}

function deleteLink(i){

links.splice(i,1);

saveLinks();

renderLinks();

}

renderLinks();

/* CHAT */

let username="";
let room="";
let isHost=false;

function createRoom(){

username=document.getElementById("username").value;
room=document.getElementById("room").value;
const pass=document.getElementById("password").value;

if(!username||!room||!pass) return alert("Fill fields");

db.ref("rooms/"+room).set({
password:pass,
host:username
});

isHost=true;

joinRoom();

}

function joinRoom(){

username=document.getElementById("username").value;
room=document.getElementById("room").value;
const pass=document.getElementById("password").value;

db.ref("rooms/"+room).once("value").then(snap=>{

if(!snap.exists()) return alert("Room doesn't exist");

const data=snap.val();

if(data.password!==pass) return alert("Wrong password");

if(data.host===username) isHost=true;

document.getElementById("chatBox").style.display="block";

addSystem(username+" joined");

listen();

});

}

function leaveRoom(){

addSystem(username+" left");

db.ref("messages/"+room).off();

document.getElementById("chatBox").style.display="none";

room="";

}

function sendMessage(){

const text=document.getElementById("messageInput").value;

if(!text) return;

const time=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

db.ref("messages/"+room).push({
user:username,
text:text,
time:time,
host:isHost
});

document.getElementById("messageInput").value="";

}

function listen(){

const box=document.getElementById("messages");

box.innerHTML="";

db.ref("messages/"+room).on("child_added",snap=>{

const m=snap.val();

const div=document.createElement("div");

div.innerHTML=`
<b class="${m.host?"host":""}">${m.user}</b>
(${m.time}):
${linkify(m.text)}
`;

if(m.user==="SYSTEM") div.className="system";

box.appendChild(div);

box.scrollTop=box.scrollHeight;

});

}

function addSystem(text){

const time=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

db.ref("messages/"+room).push({
user:"SYSTEM",
text:text,
time:time
});

}

function linkify(text){

return text.replace(/https?:\/\/[^\s]+/g,url=>`<a href="${url}" target="_blank">${url}</a>`);

}

</script>

</body>
</html>
