<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkHub</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); transition: background .3s, color .3s; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #111827;
      --primary: #6366f1;
      --accent: linear-gradient(135deg,#6366f1,#22d3ee);
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --primary: #818cf8;
      --accent: linear-gradient(135deg,#818cf8,#38bdf8);
    }

    header {
      background: var(--accent);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      background: var(--card);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    nav button {
      flex: 1;
      padding: 14px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }

    nav button.active {
      font-weight: bold;
      border-bottom: 3px solid var(--primary);
    }

    main { max-width: 520px; margin: auto; padding: 20px; }
    section { display: none; animation: fade .25s ease; }
    section.active { display: block; }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .controls { display: flex; gap: 10px; margin-bottom: 16px; }
    .controls input, .controls select {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      margin-bottom: 14px;
    }

    .card img {
      width: 44px; height: 44px; border-radius: 10px; object-fit: cover;
    }

    .card a { color: var(--text); font-weight: 600; text-decoration: none; }
    .category { font-size: 0.8rem; opacity: .7; }

    .fav, .delete, .pin {
      background: none; border: none; cursor: pointer; font-size: 1.2rem;
    }

    .delete { color: #ef4444; }

    input, select, button {
      width: 100%; padding: 14px; margin-bottom: 12px;
      border-radius: 14px; border: 1px solid #cbd5f5;
    }

    .primary {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: bold;
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--card); padding: 14px 20px; border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: none; z-index: 99;
    }

    .stats-box {
      background: var(--card); padding: 16px; border-radius: 16px;
      margin-bottom: 12px; box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<header>LinkHub</header>

<nav>
  <button class="active" onclick="showTab('links', this)">Links</button>
  <button onclick="showTab('add', this)">Add</button>
  <button onclick="showTab('stats', this)">Stats</button>
  <button onclick="toggleTheme()">🌙</button>
</nav>

<main>
  <section id="links" class="active">
    <div class="controls">
      <input id="search" placeholder="Search" onkeyup="renderLinks()" />
      <select id="filter" onchange="renderLinks()">
        <option value="all">All</option>
        <option value="school">School</option>
        <option value="social">Social</option>
        <option value="tools">Tools</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div id="list"></div>
  </section>

  <section id="add">
    <input id="name" placeholder="Link name" />
    <input id="url" placeholder="https://example.com" />
    <input id="image" placeholder="Image URL (optional)" />
    <select id="category">
      <option value="school">School</option>
      <option value="social">Social</option>
      <option value="tools">Tools</option>
      <option value="other">Other</option>
    </select>
    <button class="primary" onclick="addLink()">Add Link</button>
  </section>

  <section id="stats">
    <div class="stats-box">Total Links: <b id="total"></b></div>
    <div class="stats-box">Favorites: <b id="favs"></b></div>
    <div class="stats-box">Pinned: <b id="pins"></b></div>
    <div class="stats-box">Total Clicks: <b id="clicks"></b></div>
    <button onclick="exportLinks()">Export Links</button>
    <input type="file" accept="application/json" onchange="importLinks(event)" />
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  let links = JSON.parse(localStorage.getItem('links')) || [];

  const els = id => document.getElementById(id);

  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

  function showTab(id, btn) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    els(id).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderStats();
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    toast('Theme changed');
  }

  function toast(msg) {
    const t = els('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2200);
  }

  function save() { localStorage.setItem('links', JSON.stringify(links)); }

  function renderLinks() {
    const list = els('list');
    const search = els('search').value.toLowerCase();
    const filter = els('filter').value;
    list.innerHTML = '';

    links
      .filter(l => l.name.toLowerCase().includes(search) || l.url.toLowerCase().includes(search))
      .filter(l => filter === 'all' || l.category === filter)
      .sort((a,b) => (b.pin - a.pin) || (b.fav - a.fav))
      .forEach((l, i) => {
        const card = document.createElement('div'); card.className = 'card';

        const img = document.createElement('img'); img.src = l.image || 'https://via.placeholder.com/44';

        const info = document.createElement('div');
        info.innerHTML = `<a href="${l.url}" target="_blank" onclick="count(${i})">${l.name}</a><div class="category">${l.category}</div>`;

        const pin = document.createElement('button'); pin.className = 'pin'; pin.textContent = l.pin ? '📌' : '📍';
        pin.onclick = () => { l.pin = !l.pin; save(); renderLinks(); };

        const fav = document.createElement('button'); fav.className = 'fav'; fav.textContent = l.fav ? '⭐' : '☆';
        fav.onclick = () => { l.fav = !l.fav; save(); renderLinks(); };

        const del = document.createElement('button'); del.className = 'delete'; del.textContent = '🗑';
        del.onclick = () => { links.splice(i,1); save(); renderLinks(); toast('Deleted'); };

        card.append(img, info, pin, fav, del);
        list.appendChild(card);
      });
  }

  function addLink() {
    const name = els('name').value.trim();
    const url = els('url').value.trim();
    const image = els('image').value.trim();
    const category = els('category').value;

    if (!name || !url) { alert('Please enter name and URL'); return; }

    links.push({ name, url, image, category, fav:false, pin:false, clicks:0 });
    save();
    els('name').value = els('url').value = els('image').value = '';
    renderLinks(); toast('Link added'); showTab('links');
  }

  function count(i) { links[i].clicks++; save(); }

  function renderStats() {
    els('total').textContent = links.length;
    els('favs').textContent = links.filter(l=>l.fav).length;
    els('pins').textContent = links.filter(l=>l.pin).length;
    els('clicks').textContent = links.reduce((a,b)=>a+b.clicks,0);
  }

  function exportLinks() {
    const blob = new Blob([JSON.stringify(links,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'links.json'; a.click();
  }

  function importLinks(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { links = JSON.parse(reader.result); save(); renderLinks(); renderStats(); toast('Imported'); };
    reader.readAsText(file);
  }

  renderLinks(); renderStats();
</script>

</body>
</html>
