<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkHub</title>
<style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --text:#0f172a;
  --primary:#6366f1;
  --accent:#22d3ee;
}
body.dark{
  --bg:#0b1020;
  --card:#111827;
  --text:#f9fafb;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}
body{
  margin:0;
  background:linear-gradient(120deg,var(--bg),#e0e7ff);
  background-size:400% 400%;
  animation:bgMove 18s ease infinite;
  color:var(--text);
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
header{
  padding:16px;
  text-align:center;
  font-size:1.5rem;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg,#6366f1,#22d3ee,#a855f7);
  background-size:300% 300%;
  animation:grad 10s ease infinite;
}
@keyframes grad{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
nav{
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);
  padding:10px 0;
}
nav button{
  border:none;
  background:none;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
}
main{max-width:640px;margin:auto;padding:16px}
.hidden{display:none}
.card{
  background:linear-gradient(135deg,var(--card),#eef2ff);
  padding:14px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.18);
  margin-bottom:14px;
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card img{
  width:100%;
  max-height:160px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:8px;
}
.card a{
  text-decoration:none;
  color:var(--text);
  font-weight:700;
  font-size:1.05rem;
}
.tag{
  display:inline-block;
  margin-top:6px;
  padding:4px 10px;
  font-size:.7rem;
  border-radius:999px;
  background:linear-gradient(135deg,#22d3ee,#6366f1);
  color:white;
}
.controls input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid #c7d2fe;
  margin-bottom:12px;
}
.add input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #c7d2fe;
  margin-bottom:12px;
}
button.primary{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  font-size:1rem;
  font-weight:700;
  background:linear-gradient(135deg,#6366f1,#22d3ee);
  color:white;
  cursor:pointer;
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:12px 20px;
  border-radius:999px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>LinkHub</header>
<nav>
  <button onclick="showTab('links')">Links</button>
  <button onclick="showTab('add')">Add</button>
  <button onclick="showTab('stats')">Stats</button>
  <button onclick="toggleTheme()">🌙</button>
</nav>
<main>
<section id="links">
  <div class="controls">
    <input id="search" placeholder="Search or tag…" oninput="render()">
  </div>
  <div id="list"></div>
</section>
<section id="add" class="hidden add">
  <input id="name" placeholder="Link name">
  <input id="url" placeholder="https://example.com">
  <input id="image" placeholder="Image URL (optional)">
  <input id="tag" placeholder="Tag (school, fun, tools)">
  <button class="primary" onclick="addLink()">Add Link</button>
</section>
<section id="stats" class="hidden">
  <div class="card">Total Links: <strong><span id="total"></span></strong></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
let links = JSON.parse(localStorage.getItem('links')) || [];
const save = () => localStorage.setItem('links', JSON.stringify(links));

function showTab(id){
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function addLink(){
  const name = document.getElementById('name').value.trim();
  const url = document.getElementById('url').value.trim();
  const image = document.getElementById('image').value.trim();
  const tag = document.getElementById('tag').value.trim();
  if(!name || !url){ toast('Missing name or URL'); return; }
  links.unshift({name,url,image,tag,clicks:0});
  save();
  document.getElementById('name').value='';
  document.getElementById('url').value='';
  document.getElementById('image').value='';
  document.getElementById('tag').value='';
  render();
  showTab('links');
  toast('Link added');
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML='';
  links
    .filter(l => l.name.toLowerCase().includes(q) || (l.tag||'').toLowerCase().includes(q))
    .forEach(l => {
      const c = document.createElement('div'); c.className='card';
      if(l.image){ const img=document.createElement('img'); img.src=l.image; c.appendChild(img); }
      const a = document.createElement('a'); a.href=l.url; a.textContent=l.name; a.target='_blank';
      a.onclick=()=>{l.clicks++;save();updateStats()};
      c.appendChild(a);
      if(l.tag){ const t=document.createElement('div'); t.className='tag'; t.textContent=l.tag; c.appendChild(t); }
      list.appendChild(c);
    });
  updateStats();
}

function updateStats(){ document.getElementById('total').textContent = links.length; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function toggleTheme(){ document.body.classList.toggle('dark'); }
render();
</script>
</body>
</html>
