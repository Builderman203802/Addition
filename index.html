<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkHub</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f0f2f5;
      color: #111827;
    }

    header {
      position: sticky;
      top: 0;
      background: #6366f1;
      color: white;
      padding: 16px 20px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      z-index: 10;
    }

    main {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .search {
      margin-bottom: 20px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: white;
      padding: 16px 18px;
      border-radius: 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card a {
      text-decoration: none;
      color: #1f2933;
      font-weight: 600;
      font-size: 1rem;
    }

    .delete {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .add-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 16px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .add-panel input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
    }

    .add-panel button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #6366f1;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .add-panel button:hover {
      background: #4f46e5;
    }

    footer {
      height: 160px;
    }
  </style>
</head>
<body>

<header>LinkHub</header>

<main>
  <div class="search">
    <input type="text" id="searchBar" placeholder="Search links..." onkeyup="searchLinks()" />
  </div>

  <div class="links" id="linksContainer"></div>
</main>

<div class="add-panel">
  <input type="text" id="linkName" placeholder="Link name" />
  <input type="url" id="linkURL" placeholder="https://example.com" />
  <button onclick="addLink()">Add Link</button>
</div>

<footer></footer>

<script>
  let links = JSON.parse(localStorage.getItem('links')) || [
    { name: 'Google', url: 'https://www.google.com' },
    { name: 'YouTube', url: 'https://www.youtube.com' },
    { name: 'GitHub', url: 'https://www.github.com' }
  ];

  function saveLinks() {
    localStorage.setItem('links', JSON.stringify(links));
  }

  function renderLinks() {
    const container = document.getElementById('linksContainer');
    container.innerHTML = '';

    links.forEach((link, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      const anchor = document.createElement('a');
      anchor.href = link.url;
      anchor.target = '_blank';
      anchor.textContent = link.name;

      const del = document.createElement('button');
      del.className = 'delete';
      del.innerHTML = '🗑';
      del.onclick = () => deleteLink(index);

      card.appendChild(anchor);
      card.appendChild(del);
      container.appendChild(card);
    });
  }

  function addLink() {
    const name = document.getElementById('linkName').value.trim();
    const url = document.getElementById('linkURL').value.trim();

    if (!name || !url) return alert('Enter a name and URL');

    links.push({ name, url });
    saveLinks();
    renderLinks();

    document.getElementById('linkName').value = '';
    document.getElementById('linkURL').value = '';
  }

  function deleteLink(index) {
    links.splice(index, 1);
    saveLinks();
    renderLinks();
  }

  function searchLinks() {
    const filter = document.getElementById('searchBar').value.toLowerCase();
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      const text = card.textContent.toLowerCase();
      card.style.display = text.includes(filter) ? 'flex' : 'none';
    });
  }

  renderLinks();
</script>

</body>
</html>
