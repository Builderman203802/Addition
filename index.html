<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkHub</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: #f0f2f5; }

    header { background: #6366f1; color: white; padding: 14px; text-align: center; font-size: 1.4rem; font-weight: bold; }

    nav { display: flex; justify-content: space-around; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    nav button { flex: 1; padding: 14px; border: none; background: none; font-size: 1rem; cursor: pointer; }
    nav button.active { color: #6366f1; font-weight: bold; border-bottom: 3px solid #6366f1; }

    main { max-width: 520px; margin: auto; padding: 20px; }
    section { display: none; }
    section.active { display: block; }

    .controls { display: flex; gap: 10px; margin-bottom: 16px; }
    .controls input, .controls select { flex: 1; padding: 12px; border-radius: 10px; border: none; }

    .card { background: white; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 14px rgba(0,0,0,0.1); margin-bottom: 12px; }
    .card img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .card a { font-weight: 600; color: #111827; text-decoration: none; }
    .category { font-size: 0.8rem; color: #6b7280; }

    .delete { margin-left: auto; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ef4444; }

    input, select, button { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #d1d5db; }
    .primary { background: #6366f1; color: white; border: none; font-weight: bold; }
  </style>
</head>
<body>

<header>LinkHub</header>

<nav>
  <button class="active" onclick="showTab('links', this)">Links</button>
  <button onclick="showTab('add', this)">Add</button>
  <button onclick="showTab('about', this)">About</button>
</nav>

<main>
  <section id="links" class="active">
    <div class="controls">
      <input id="search" placeholder="Search links" onkeyup="renderLinks()" />
      <select id="filter" onchange="renderLinks()">
        <option value="all">All</option>
        <option value="school">School</option>
        <option value="social">Social</option>
        <option value="tools">Tools</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div id="list"></div>
  </section>

  <section id="add">
    <input id="name" placeholder="Link name" />
    <input id="url" placeholder="https://example.com" />
    <input id="image" placeholder="Image URL (optional)" />
    <select id="category">
      <option value="school">School</option>
      <option value="social">Social</option>
      <option value="tools">Tools</option>
      <option value="other">Other</option>
    </select>
    <button class="primary" onclick="addLink()">Add Link</button>
  </section>

  <section id="about">
    <h3>Learn about LinkHub</h3>
    <p>This website was created by Christian Magana. Add and click on any link ever!</p>
  </section>
</main>

<script>
  let links = JSON.parse(localStorage.getItem('links')) || [];

  function showTab(id, btn) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function save() { localStorage.setItem('links', JSON.stringify(links)); }

  function renderLinks() {
    const list = document.getElementById('list');
    const search = document.getElementById('search').value.toLowerCase();
    const filter = document.getElementById('filter').value;
    list.innerHTML = '';

    links
      .filter(l => l.name.toLowerCase().includes(search))
      .filter(l => filter === 'all' || l.category === filter)
      .forEach((l, i) => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.src = l.image || 'https://via.placeholder.com/40';

        const info = document.createElement('div');
        info.innerHTML = `<a href="${l.url}" target="_blank">${l.name}</a><div class="category">${l.category}</div>`;

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = '🗑';
        del.onclick = () => { links.splice(i,1); save(); renderLinks(); };

        card.append(img, info, del);
        list.appendChild(card);
      });
  }

  function addLink() {
    const name = document.getElementById('name').value.trim();
    const url = document.getElementById('url').value.trim();
    const image = document.getElementById('image').value.trim();
    const category = document.getElementById('category').value;
    if (!name || !url) return alert('Missing name or URL');
    links.push({ name, url, image, category });
    save(); renderLinks(); showTab('links', document.querySelector('nav button'));
  }

  renderLinks();
</script>

</body>
</html>
